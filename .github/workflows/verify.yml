name: Verify native secrets integration

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
    name: Check ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [php, go, upstream]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-harness
        id: harness
        with:
          suite: ${{ matrix.suite }}
      - name: Initialize native PHP fixture
        if: matrix.suite == 'php'
        run: ./tools/dev install-fixture
      - name: Run complete suite
        run: ./tools/dev check --suite '${{ matrix.suite }}'
      - name: Snapshot dependency caches
        if: ${{ !cancelled() && steps.harness.outcome == 'success' && steps.harness.outputs.cache-hit != 'true' }}
        id: cache-snapshot
        run: python3 tools/ci_cache.py save '${{ matrix.suite }}'
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.cache-snapshot.outcome == 'success' && steps.harness.outputs.cache-hit != 'true' }}
        with:
          path: .work/ci-cache
          key: ${{ steps.harness.outputs.cache-key }}
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    name: Full release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-harness
        id: harness
        with:
          suite: full
      - name: Install through native Panel tooling
        run: ./tools/dev install-fixture
      - name: Verify PHP, protocol, Go and package policies
        run: ./tools/dev check
      - name: Build candidate from exact pinned sources
        run: ./tools/dev candidate
      - name: Exercise every required live case without skips
        run: ./tools/dev acceptance
      - name: Reproduce qualified artifacts
        run: ./tools/dev package
      - name: Include qualification evidence
        run: cp .work/check-results.json .work/acceptance-results.json dist/
      - name: Save qualified release files
        uses: actions/upload-artifact@v7
        with:
          name: qualified-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Snapshot dependency caches
        if: ${{ !cancelled() && steps.harness.outcome == 'success' && steps.harness.outputs.cache-hit != 'true' }}
        id: cache-snapshot
        run: python3 tools/ci_cache.py save full
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.cache-snapshot.outcome == 'success' && steps.harness.outputs.cache-hit != 'true' }}
        with:
          path: .work/ci-cache
          key: ${{ steps.harness.outputs.cache-key }}
